name: Build 3DS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Libraries
        run: dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-zlib

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: CIA tools
        run: |
          apt-get update -qq && apt-get install -y -qq unzip curl > /dev/null
          curl -sSL -o bt.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3-linux.tar.gz
          mkdir bt && tar xzf bt.tar.gz -C bt
          curl -sSL -o mr.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -q mr.zip -d mr
          echo "BANNERTOOL=$(find bt -type f -name bannertool | head -1)" >> "$GITHUB_ENV"
          echo "MAKEROM=$(find mr -type f -name makerom | head -1)" >> "$GITHUB_ENV"

      - name: Build .cia
        run: |
          chmod +x "$BANNERTOOL" "$MAKEROM"
          VER=$(sed -n 's/^#define APP_VERSION *"\(.*\)"/\1/p' core/config.h)
          MAJOR=${VER%%.*}; MINOR=${VER#*.}; MINOR=${MINOR%%.*}
          "$BANNERTOOL" makebanner -i meta/banner.png -a meta/banner.wav -o banner.bnr
          "$BANNERTOOL" makesmdh -s "VitaIRC" -l "IRC client for Nintendo 3DS" -p "ArchelKrozt" -i meta/icon.png -o icon.icn
          "$MAKEROM" -f cia -o VitaIRC.cia -elf VitaIRC.elf -rsf meta/app.rsf -icon icon.icn -banner banner.bnr \
                     -exefslogo -target t -major "$MAJOR" -minor "$MINOR" -micro 0
          ls -la VitaIRC.3dsx VitaIRC.cia

      - uses: actions/upload-artifact@v4
        with:
          name: VitaIRC-3DS
          path: |
            VitaIRC.3dsx
            VitaIRC.cia

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VitaIRC.3dsx
            VitaIRC.cia
          generate_release_notes: true
